<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment status | Jaman Store</title><meta name="theme-color" content="#0b63ce"><style>body{margin:0;background:#f6f8fb;color:#152033;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.wrap{max-width:680px;margin:12vh auto;padding:24px}.card{background:#fff;border:1px solid #e6eaf0;border-radius:24px;padding:30px;box-shadow:0 12px 40px #10182812;text-align:center}h1{margin-top:0}.status{padding:18px;border-radius:16px;margin:20px 0;text-align:left}.ok{background:#edf9f3;border:1px solid #b8e3cc;color:#145c3a}.bad{background:#fff2f2;border:1px solid #efc0c0;color:#8b1e1e}.pending{background:#fffaf0;border:1px solid #ead9a7;color:#805b00}.btn{display:inline-block;background:#0b63ce;color:#fff;padding:13px 18px;border-radius:12px;text-decoration:none;font-weight:800;margin-top:8px}</style></head><body><div class="wrap"><div class="card"><div style="font-size:42px">🛏️</div><h1>Jaman Store</h1><p id="lead">Checking your Paystack payment…</p><div id="status" class="status pending">Please wait while we verify the transaction securely.</div><a class="btn" href="/">Return to Jaman Store</a></div></div><script>(async()=>{const box=document.getElementById("status"),lead=document.getElementById("lead"),ref=new URLSearchParams(location.search).get("reference");if(!ref){lead.textContent="No payment reference was supplied.";box.className="status bad";box.textContent="Please return to the store and contact Jaman Store if you were charged.";return}try{const r=await fetch("/api/paystack/verify?reference="+encodeURIComponent(ref)),d=await r.json();if(d.verified){lead.textContent="Payment verified successfully.";box.className="status ok";box.innerHTML="<strong>Payment successful</strong><br>Reference: "+d.reference+"<br>Amount verified: ₦"+(Number(d.amount)/100).toLocaleString("en-NG",{minimumFractionDigits:2})+"<br><br>Your order details should be confirmed with Jaman Store before fulfilment.";localStorage.removeItem("jaman_cart");sessionStorage.removeItem("jaman_pending_reference")}else if(["pending","ongoing","processing"].includes(d.transaction_status)){lead.textContent="Payment is still being processed.";box.className="status pending";box.textContent="Reference: "+(d.reference||ref)+". Please wait and check again, or contact Jaman Store."}else{lead.textContent="Payment was not verified as successful.";box.className="status bad";box.innerHTML="Transaction status: "+(d.transaction_status||"unknown")+"<br>Reference: "+(d.reference||ref)+"<br><br>If you believe you were charged, contact Jaman Store with the reference above."}}catch(e){lead.textContent="We could not complete the verification request.";box.className="status bad";box.textContent="Please contact Jaman Store with payment reference: "+ref}})();</script></body></html>
