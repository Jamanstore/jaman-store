<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jaman Store Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--blue:#0b63ce;--ink:#152033;--muted:#667085;--bg:#f5f7fa;--card:#fff;--line:#e4e8ee}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
button,input,select{font:inherit}.wrap{max-width:1180px;margin:auto;padding:18px}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:0 18px 50px #10182812}.logo{font-size:25px;font-weight:950}.muted{color:var(--muted)}label{display:block;font-size:13px;font-weight:800;margin:16px 0 7px}input{width:100%;padding:13px;border:1px solid #ccd3dd;border-radius:10px}.btn{border:0;border-radius:10px;background:var(--blue);color:#fff;padding:12px 16px;font-weight:850;cursor:pointer}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.full{width:100%;margin-top:18px}.error{color:#b42318;background:#fff1f0;border:1px solid #ffd4cf;padding:11px;border-radius:10px;margin-top:14px;display:none}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.head{display:flex;align-items:center;justify-content:space-between;gap:12px}.head h1{font-size:22px;margin:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.stat small{color:var(--muted);font-weight:750}.stat strong{display:block;font-size:25px;margin-top:7px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:16px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.panel h2{margin:0;font-size:18px}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted);font-size:12px}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#eef5ff;color:#1554a0;font-weight:800;font-size:11px}.actions{display:flex;gap:7px;align-items:center}.select{padding:7px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:12px}.empty{padding:25px;text-align:center;color:var(--muted)}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}table{display:block;overflow:auto;white-space:nowrap}.wrap{padding:14px}.head h1{font-size:19px}}
</style>
</head>
<body>
<section id="login" class="login">
<div class="login-card">
<div class="logo">Jaman Store</div>
<h1>Management Dashboard</h1>
<p class="muted">Secure access for authorized Jaman Store management.</p>
<form id="loginForm">
<label>Email</label><input id="email" type="email" autocomplete="username" required>
<label>Password</label><input id="password" type="password" autocomplete="current-password" required>
<button class="btn full" type="submit">Sign in</button>
<div id="loginError" class="error"></div>
</form>
</div>
</section>
<section id="app" hidden>
<header><div class="wrap head"><div><h1>Jaman Store Admin</h1><span id="who" class="muted"></span></div><button id="logout" class="btn secondary">Sign out</button></div></header>
<main class="wrap">
<div class="grid">
<div class="stat"><small>Today's sales</small><strong id="todaySales">₦0</strong></div>
<div class="stat"><small>Orders today</small><strong id="ordersToday">0</strong></div>
<div class="stat"><small>Pending orders</small><strong id="pendingOrders">0</strong></div>
<div class="stat"><small>Paid orders</small><strong id="paidOrders">0</strong></div>
</div>
<div class="panel">
<div class="panel-head"><h2>Recent orders</h2><button id="refresh" class="btn secondary">Refresh</button></div>
<div id="tableWrap" class="empty">Loading orders…</div>
</div>
</main>
</section>
<script>
const SUPABASE_URL="https://ilzeavaseohrbmprditr.supabase.co";
const SUPABASE_KEY="sb_publishable_3RYoXu_OVN6YtmLg1dolvA_mSugdq-O";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const money=n=>new Intl.NumberFormat("en-NG",{style:"currency",currency:"NGN",maximumFractionDigits:2}).format(Number(n||0));
function showLoginError(msg){$("loginError").textContent=msg;$("loginError").style.display="block";}
async function loadDashboard(){
  const {data,error}=await sb.rpc("admin_get_dashboard");
  if(error){throw error;}
  $("todaySales").textContent=money(data.today_sales);
  $("ordersToday").textContent=data.orders_today||0;
  $("pendingOrders").textContent=data.pending_orders||0;
  $("paidOrders").textContent=data.paid_orders||0;
  const rows=data.recent_orders||[];
  if(!rows.length){$("tableWrap").innerHTML='<div class="empty">No orders have been recorded yet.</div>';return;}
  $("tableWrap").innerHTML='<table><thead><tr><th>Order</th><th>Customer</th><th>Amount</th><th>Payment</th><th>Order status</th><th>Created</th></tr></thead><tbody>'+
    rows.map(o=>'<tr><td><strong>'+esc(o.order_reference)+'</strong></td><td>'+esc(o.customer_name||"")+'<br><span class="muted">'+esc(o.customer_phone||"")+'</span></td><td>'+money(o.total_naira)+'</td><td><span class="pill">'+esc(o.payment_status)+'</span></td><td><div class="actions"><select class="select status" data-id="'+esc(o.id)+'">'+["pending","confirmed","processing","shipped","delivered","cancelled"].map(s=>'<option '+(s===o.status?"selected":"")+'>'+s+'</option>').join("")+'</select></div></td><td>'+new Date(o.created_at).toLocaleString("en-NG")+'</td></tr>').join("")+
    '</tbody></table>';
  document.querySelectorAll(".status").forEach(el=>el.addEventListener("change",async e=>{
    const {error}=await sb.rpc("admin_update_order_status",{p_order_id:e.target.dataset.id,p_status:e.target.value});
    if(error){alert(error.message);await loadDashboard();}
  }));
}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
async function enter(user){
  $("login").hidden=true;$("app").hidden=false;$("who").textContent=user.email;
  try{await loadDashboard();}catch(e){$("tableWrap").textContent=e.message||"Unable to load dashboard.";}
}
$("loginForm").addEventListener("submit",async e=>{
 e.preventDefault();$("loginError").style.display="none";
 const {data,error}=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});
 if(error){showLoginError("Sign-in failed. Check your credentials or contact the administrator.");return;}
 await enter(data.user);
});
$("logout").addEventListener("click",async()=>{await sb.auth.signOut();$("app").hidden=true;$("login").hidden=false;});
$("refresh").addEventListener("click",()=>loadDashboard().catch(e=>alert(e.message)));
sb.auth.getSession().then(({data})=>{if(data.session)enter(data.session.user);});
</script>
</body>
</html>
