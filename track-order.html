<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Track Order | Jaman Store</title>
<meta name="description" content="Track your Jaman Store order from payment through delivery or collection.">
<style>
:root{--navy:#075E5B;--teal:#087F7A;--ink:#101828;--muted:#667085;--line:#e2e7ee;--bg:#f7f8fa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.top{background:var(--navy);color:#fff;text-align:center;padding:9px;font-size:12px}.wrap{max-width:760px;margin:auto;padding:30px 16px 60px}a{color:var(--teal);text-decoration:none}.brand{font-weight:950;font-size:24px;color:var(--ink)}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin-top:18px;box-shadow:0 8px 25px #1018280a}.muted{color:var(--muted);line-height:1.5}.field{margin:13px 0}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}.field input{width:100%;padding:13px;border:1px solid #ccd3dd;border-radius:9px;font:inherit}.btn{width:100%;border:0;border-radius:9px;background:var(--teal);color:#fff;padding:13px;font-weight:900;font-size:15px;cursor:pointer}.error{display:none;background:#fff1f0;color:#b42318;border:1px solid #ffd4cf;border-radius:9px;padding:11px;margin-top:13px}.result{display:none}.head{display:flex;justify-content:space-between;gap:15px;align-items:start;flex-wrap:wrap}.orderref{font-weight:900;font-size:20px}.amount{font-weight:950;font-size:22px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.summary>div{background:#f7f9fb;border:1px solid var(--line);border-radius:10px;padding:12px}.summary small{display:block;color:var(--muted);font-size:11px}.summary strong{display:block;margin-top:5px}.timeline{margin-top:22px}.step{display:grid;grid-template-columns:30px 1fr;gap:12px;position:relative;padding-bottom:22px}.step:last-child{padding-bottom:0}.dot{width:24px;height:24px;border-radius:50%;border:2px solid #cbd5df;background:#fff;z-index:2}.step.done .dot,.step.current .dot{background:var(--teal);border-color:var(--teal)}.step:before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:#dbe2e8}.step:last-child:before{display:none}.step.done:before{background:var(--teal)}.step b{display:block}.step span{font-size:12px;color:var(--muted)}.history{margin-top:22px;border-top:1px solid var(--line);padding-top:15px}.history-row{padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}.history-row span{display:block;color:var(--muted);font-size:11px;margin-top:3px}@media(max-width:600px){.summary{grid-template-columns:1fr 1fr}.summary>div:last-child{grid-column:1/-1}}
</style></head>
<body><div class="top">Jaman Store • Order Tracking • Delivery: 5–10 days</div>
<div class="wrap"><a class="brand" href="/">JAMAN STORE</a>
<div class="card"><h1>Track your order</h1><p class="muted">Enter your order reference and the phone number used during checkout. No account is required.</p>
<form id="trackForm"><div class="field"><label>Order reference</label><input id="reference" placeholder="e.g. JAMAN-..." autocomplete="off" required></div><div class="field"><label>Phone number</label><input id="phone" placeholder="080..." autocomplete="tel" required></div><button class="btn">Track Order</button></form><div id="error" class="error"></div></div>
<div id="result" class="card result"></div></div>
<script>
const money=n=>"₦"+Number(n||0).toLocaleString("en-NG",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=v=>String(v??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const steps=["pending","payment_successful","confirmed","processing","dispatched"];
function label(s){return ({pending:"Order Placed",payment_successful:"Payment Successful",confirmed:"Order Confirmed",processing:"Processing",dispatched:"Dispatched",delivered:"Delivered",collected:"Collected",cancelled:"Cancelled"})[s]||s}
function render(o,h){const final=o.delivery_method==="pickup"?"collected":"delivered";const sequence=["pending","payment_successful","confirmed","processing","dispatched",final];const current=o.status==="pending"?(o.payment_status==="paid"?1:0):sequence.indexOf(o.status);const cancelled=o.status==="cancelled";document.getElementById("result").innerHTML='<div class="head"><div><div class="orderref">'+esc(o.order_reference)+'</div><div class="muted">'+esc(o.customer_name)+' • '+esc(o.city||"")+'</div></div><div class="amount">'+money(o.total_naira)+'</div></div><div class="summary"><div><small>Payment</small><strong>'+esc(o.payment_status==="paid"?"Successful":o.payment_status)+'</strong></div><div><small>Delivery</small><strong>'+esc(o.delivery_method==="pickup"?"Pickup":"Doorstep")+'</strong></div><div><small>Time</small><strong>5–10 days</strong></div><div><small>Product total</small><strong>'+money(o.subtotal_naira)+'</strong></div><div><small>Delivery fee</small><strong>'+money(o.delivery_fee_naira)+'</strong></div><div><small>Order total</small><strong>'+money(o.total_naira)+'</strong></div></div><div class="timeline">'+(cancelled?'<div class="step current"><div class="dot"></div><div><b>Cancelled</b><span>The order has been cancelled.</span></div></div>':sequence.map((s,i)=>'<div class="step '+(i<current?"done":i===current?"current":"")+'"><div class="dot"></div><div><b>'+label(s)+'</b><span>'+({"pending":"Your order has been received.","payment_successful":"Paystack payment was verified successfully.","confirmed":"Your payment has been received and the order is confirmed.","processing":"Your order is being prepared.","dispatched":"Your order has been dispatched.","delivered":"Your order has been delivered.","collected":"Your order is ready and has been collected."}[s]||"")+'</span></div></div>').join(""))+'</div><div class="history"><b>Order activity</b>'+((h||[]).map(x=>'<div class="history-row"><strong>'+esc(label(x.status))+'</strong>'+(x.note?" — "+esc(x.note):"")+'<span>'+new Date(x.created_at).toLocaleString("en-NG")+'</span></div>').join("")||'<p class="muted">No activity history is available yet.</p>')+'</div>';
document.getElementById("result").style.display="block"}
document.getElementById("trackForm").addEventListener("submit",async e=>{e.preventDefault();const err=document.getElementById("error");err.style.display="none";try{const r=await fetch("/api/orders/track?reference="+encodeURIComponent(document.getElementById("reference").value.trim())+"&phone="+encodeURIComponent(document.getElementById("phone").value.trim()),{cache:"no-store"});const d=await r.json();if(!r.ok||!d.status)throw new Error(d.message||"Order not found.");render(d.order,d.history)}catch(x){err.textContent=x.message||"Unable to track this order.";err.style.display="block";}});
</script></body></html>
